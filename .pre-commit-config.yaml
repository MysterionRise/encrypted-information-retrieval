# Pre-commit hooks for code quality
# Install: pre-commit install
# Run manually: pre-commit run --all-files
#
# Tool versions mirror the pins in .github/workflows/ci.yml (env block).
# Update both together.

repos:
  # Basic file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        name: Remove trailing whitespace
      - id: end-of-file-fixer
        name: Ensure files end with newline
      - id: check-yaml
        name: Check YAML syntax
      - id: check-json
        name: Check JSON syntax
      - id: check-toml
        name: Check TOML syntax
      - id: check-added-large-files
        name: Check for large files
        args: ['--maxkb=500']
      - id: check-merge-conflict
        name: Check for merge conflicts
      - id: check-case-conflict
        name: Check for case conflicts
      - id: detect-private-key
        name: Detect private keys
      - id: mixed-line-ending
        name: Check line endings
        args: ['--fix=lf']

  # Python code formatting (CI: black==25.11.0)
  - repo: https://github.com/psf/black
    rev: 25.11.0
    hooks:
      - id: black
        name: Format code with black
        language_version: python3.11

  # Linting, including import order via ruff's "I" rules (CI: ruff==0.17.1)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff
        name: Lint with ruff
        args: ['--fix', '--exit-non-zero-on-fix']

  # Security checks (CI: bandit==1.9.4)
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        name: Security checks with bandit
        args: ['-ll', '-r', 'src']
        exclude: '^tests/'

  # Type checking (CI: mypy==2.2.0)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.2.0
    hooks:
      - id: mypy
        name: Type check with mypy
        additional_dependencies: [types-setuptools]
        args: ['--disable-error-code', 'redundant-cast', '--ignore-missing-imports', '--no-strict-optional']
        files: ^src/

# Configuration
default_language_version:
  python: python3.11

default_stages: [pre-commit]

# Skip hooks for specific files
exclude: |
  (?x)^(
      migrations/|
      \.git/|
      \.venv/|
      venv/|
      build/|
      dist/|
      .*\.egg-info/
  )
