name: CI

on:
  push:
    branches: [ main, master, develop, 'claude/**', 'codex/**' ]
  pull_request:
    branches: [ main, master, develop ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

# Tool versions are pinned here and mirrored in .pre-commit-config.yaml.
env:
  BLACK_VERSION: "25.11.0"
  RUFF_VERSION: "0.17.1"
  MYPY_VERSION: "2.2.0"
  BANDIT_VERSION: "1.9.4"

jobs:
  # Code quality: formatting, lint (including import order via ruff "I"), types, static security.
  lint:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install "black==${BLACK_VERSION}" "ruff==${RUFF_VERSION}" "mypy==${MYPY_VERSION}" "bandit==${BANDIT_VERSION}"

      - name: Check code formatting (black)
        run: black --check src tests examples

      - name: Lint with ruff
        run: ruff check src tests examples

      - name: Security check with bandit
        run: bandit -r src -ll -f screen

      - name: Type check with mypy
        run: |
          PYTHONPATH=src:$PYTHONPATH mypy --disable-error-code redundant-cast src/encrypted_ir --ignore-missing-imports --no-strict-optional

  # Unit and integration tests against PostgreSQL on every supported Python.
  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: encrypted_ir_test
          POSTGRES_USER: encrypted_ir
          POSTGRES_PASSWORD: encrypted_ir_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U encrypted_ir -d encrypted_ir_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql+psycopg://encrypted_ir:encrypted_ir_test_password@localhost:5432/encrypted_ir_test
        run: |
          alembic upgrade head

      - name: Run tests
        env:
          POSTGRES_TEST_DATABASE_URL: postgresql+psycopg://encrypted_ir:encrypted_ir_test_password@localhost:5432/encrypted_ir_test
        # --benchmark-disable runs each benchmarked function once without calibration;
        # timings are measured only by the benchmarks job.
        run: |
          PYTHONPATH=src:$PYTHONPATH python -m pytest -v -rs --timeout=60 --benchmark-disable
        timeout-minutes: 10

  # Coverage with an enforced floor. Measured 87.13% on 2026-10-20; the floor ratchets up, never down.
  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies with research extras
        # Coverage measures the research prototypes too, so their tests must run here.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
          pip install -r requirements-research.txt

      - name: Run tests with coverage (fails under the floor)
        run: |
          PYTHONPATH=src:$PYTHONPATH python -m pytest \
            --benchmark-disable \
            --cov=src/encrypted_ir \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html \
            --cov-fail-under=86

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-encrypted-ir
          fail_ci_if_error: false

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 30

  # Dependency and static security scanning. Both steps are blocking.
  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "bandit==${BANDIT_VERSION}" pip-audit

      - name: Run bandit security scanner
        run: |
          bandit -r src -ll -f json -o bandit-report.json || true
          bandit -r src -ll -f screen

      - name: Audit dependencies for known vulnerabilities (pip-audit)
        run: |
          pip-audit -r requirements-ci.txt -r requirements-api.txt -r requirements-research.txt

      - name: Upload security report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: security-report
          path: bandit-report.json
          retention-days: 30

  # Optional research modules (TenSEAL CKKS, pqcrypto ML-KEM/ML-DSA). Their tests skip
  # when the extras are missing, so this job installs the extras and fails if they
  # cannot be imported, which stops those tests from silently skipping.
  research:
    name: Research Modules (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies with research extras
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
          pip install -r requirements-research.txt

      - name: Verify research extras import
        run: |
          python -c "import tenseal; from pqcrypto.kem import ml_kem_768; from pqcrypto.sign import ml_dsa_65; print('research extras importable')"

      - name: Run full suite with research extras
        run: |
          PYTHONPATH=src:$PYTHONPATH python -m pytest -rs --timeout=120 --benchmark-disable
        timeout-minutes: 15

  # Build the API image and run the Compose persistence smoke test from docs/CTO_DEMO_SCRIPT.md.
  docker:
    name: Docker Compose Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build and start the stack
        run: docker compose up -d --build

      - name: Ingest, restart, and retrieve
        run: ./scripts/compose_smoke.sh

      - name: Show container logs
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v

  # Performance benchmarks on master only. Informational: not part of CI Success.
  benchmarks:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Run benchmarks
        run: |
          mkdir -p benchmarks/results
          PYTHONPATH=src:$PYTHONPATH python -m pytest \
            tests/test_benchmarks.py \
            tests/research/test_benchmarks_research.py \
            --benchmark-only \
            --benchmark-json=benchmarks/results/latest.json

      - name: Keep summary statistics only
        # --benchmark-json embeds every raw timing (about 150 MB); keep min/mean/median/etc.
        run: |
          python - <<'PY'
          import json
          import pathlib

          path = pathlib.Path("benchmarks/results/latest.json")
          report = json.loads(path.read_text())
          for bench in report["benchmarks"]:
              bench["stats"].pop("data", None)
          path.write_text(json.dumps(report, indent=2))
          PY

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark-results
          path: benchmarks/results/
          retention-days: 90

  # Package build check.
  build:
    name: Build Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: |
          python -m build

      - name: Check package
        run: |
          twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-package
          path: dist/
          retention-days: 30

  # Single required status: every gating job must succeed.
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [lint, test, coverage, security, research, docker, build]
    if: always()
    steps:
      - name: Check all gating jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "  \(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null
