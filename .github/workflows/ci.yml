name: CI

on:
  push:
    branches: [ main, master, develop, 'claude/**', 'codex/**' ]
  pull_request:
    branches: [ main, master, develop ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

# Tool versions are pinned here and mirrored in .pre-commit-config.yaml.
env:
  BLACK_VERSION: "25.11.0"
  RUFF_VERSION: "0.17.1"
  MYPY_VERSION: "2.2.0"
  BANDIT_VERSION: "1.9.4"

jobs:
  # Code quality: formatting, lint (including import order via ruff "I"), types, static security.
  lint:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install "black==${BLACK_VERSION}" "ruff==${RUFF_VERSION}" "mypy==${MYPY_VERSION}" "bandit==${BANDIT_VERSION}"

      - name: Check code formatting (black)
        run: black --check src tests examples benchmarks scripts

      - name: Lint with ruff
        run: ruff check src tests examples benchmarks scripts

      - name: Security check with bandit
        run: bandit -r src -ll -f screen

      - name: Type check with mypy
        run: |
          PYTHONPATH=src:$PYTHONPATH mypy --disable-error-code redundant-cast src/encrypted_ir --ignore-missing-imports --no-strict-optional

      - name: Relative links in Markdown resolve
        run: python scripts/check_links.py

  # Unit and integration tests against PostgreSQL on every supported Python.
  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: encrypted_ir_test
          POSTGRES_USER: encrypted_ir
          POSTGRES_PASSWORD: encrypted_ir_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U encrypted_ir -d encrypted_ir_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql+psycopg://encrypted_ir:encrypted_ir_test_password@localhost:5432/encrypted_ir_test
        run: |
          alembic upgrade head

      - name: Run tests
        env:
          POSTGRES_TEST_DATABASE_URL: postgresql+psycopg://encrypted_ir:encrypted_ir_test_password@localhost:5432/encrypted_ir_test
        # The whole suite, API tests included, runs on PostgreSQL: each xdist worker gets its own
        # migrated schema (tests/conftest.py). Benchmarks live in benchmarks/, outside testpaths.
        run: |
          PYTHONPATH=src:$PYTHONPATH python -m pytest -v -rs --timeout=60 -n auto \
            --junitxml=evidence/junit-test-py${{ matrix.python-version }}.xml
        timeout-minutes: 10

      - name: Keep the test counts for the evidence job
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidence-test-py${{ matrix.python-version }}
          path: evidence/
          if-no-files-found: ignore
          retention-days: 90

  # Coverage with an enforced floor. Measured 87.13% on 2026-10-20; the floor ratchets up, never down.
  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: encrypted_ir_test
          POSTGRES_USER: encrypted_ir
          POSTGRES_PASSWORD: encrypted_ir_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U encrypted_ir -d encrypted_ir_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies with research extras
        # Coverage measures the research prototypes too, so their tests must run here.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
          pip install -r requirements-research.txt

      - name: Run tests with coverage (fails under the floor)
        env:
          POSTGRES_TEST_DATABASE_URL: postgresql+psycopg://encrypted_ir:encrypted_ir_test_password@localhost:5432/encrypted_ir_test
        run: |
          PYTHONPATH=src:$PYTHONPATH python -m pytest \
            -n auto \
            --cov=src/encrypted_ir \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html \
            --cov-fail-under=86 \
            --junitxml=evidence/junit-coverage.xml

      - name: Keep the test counts and coverage for the evidence job
        if: always()
        run: cp coverage.xml evidence/ || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidence-coverage
          path: evidence/
          if-no-files-found: ignore
          retention-days: 90

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-encrypted-ir
          fail_ci_if_error: false

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 30

  # Dependency and static security scanning. Both steps are blocking.
  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "bandit==${BANDIT_VERSION}" pip-audit

      - name: Run bandit security scanner
        run: |
          bandit -r src -ll -f json -o bandit-report.json || true
          bandit -r src -ll -f screen

      - name: Audit dependencies for known vulnerabilities (pip-audit)
        run: |
          pip-audit -r requirements-ci.txt -r requirements-research.txt
          # Separately: the Docker lock pins hashes (pip then requires them for every line)
          # and its own versions.
          pip-audit -r requirements-docker.txt

      - name: Upload security report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: security-report
          path: bandit-report.json
          retention-days: 30

  # Optional research modules (TenSEAL CKKS, pqcrypto ML-KEM/ML-DSA). Their tests skip
  # when the extras are missing, so this job installs the extras and fails if they
  # cannot be imported, which stops those tests from silently skipping.
  research:
    name: Research Modules (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies with research extras
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
          pip install -r requirements-research.txt

      - name: Verify research extras import
        run: |
          python -c "import tenseal; from pqcrypto.kem import ml_kem_768; from pqcrypto.sign import ml_dsa_65; print('research extras importable')"

      - name: Run full suite with research extras
        run: |
          PYTHONPATH=src:$PYTHONPATH python -m pytest -rs --timeout=120 -n auto \
            --junitxml=evidence/junit-research.xml
        timeout-minutes: 15

      - name: Keep the test counts for the evidence job
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidence-research
          path: evidence/
          if-no-files-found: ignore
          retention-days: 90

  # Build the API image and run the Compose persistence smoke test from docs/CTO_DEMO_SCRIPT.md.
  docker:
    name: Docker Compose Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Compose refuses to start without the .env values
        run: |
          if docker compose --env-file /dev/null config > /dev/null 2> missing.txt; then
            echo "compose config succeeded without .env"; exit 1
          fi
          grep -q "POSTGRES" missing.txt

      - name: Create .env from the committed demo values
        run: cp .env.example .env

      - name: Build and start the stack
        run: docker compose up -d --build

      - name: Migrations ran as a separate one-shot service
        run: |
          container="$(docker compose ps -a -q migrate)"
          test "$(docker inspect --format '{{.State.ExitCode}}' "$container")" = "0"
          docker compose logs migrate | grep -q "Running upgrade"

      - name: PostgreSQL is not published to the host
        run: |
          if docker compose port postgres 5432 > /dev/null 2>&1; then
            echo "postgres:5432 is published on the host"; exit 1
          fi
          for files in docker-compose.yml docker-compose.yml:docker-compose.kms.yml \
              docker-compose.yml:docker-compose.kms.yml:docker-compose.oidc.yml; do
            COMPOSE_FILE="$files" docker compose config --format json \
              | jq -e '.services.postgres.ports == null' > /dev/null
          done

      - name: The image runs as a non-root user
        run: test "$(docker run --rm --entrypoint id encrypted-ir:local -u)" = "10001"

      - name: The AWS KMS path starts from the image (boto3 is installed)
        run: |
          # A KMS endpoint nobody listens on: startup must get as far as calling KMS and fail
          # there, not on a missing boto3.
          set +e
          output="$(timeout 120 docker run --rm \
            -e ENCRYPTED_IR_ENV=dev \
            -e ENCRYPTED_IR_KMS_PROVIDER=aws \
            -e ENCRYPTED_IR_AWS_KMS_KEY_ID=alias/ci-placeholder \
            -e ENCRYPTED_IR_ENCRYPTED_MASTER_KEY_B64=Y2ktcGxhY2Vob2xkZXI= \
            -e DATABASE_URL=sqlite+pysqlite:///:memory: \
            -e AWS_REGION=us-east-1 \
            -e AWS_ACCESS_KEY_ID=ci-placeholder \
            -e AWS_SECRET_ACCESS_KEY=placeholder-not-a-secret \
            -e AWS_ENDPOINT_URL_KMS=http://127.0.0.1:9 \
            -e AWS_MAX_ATTEMPTS=1 \
            -e AWS_EC2_METADATA_DISABLED=true \
            encrypted-ir:local 2>&1)"
          status=$?
          set -e
          echo "$output" | tail -n 25
          if [ "$status" -eq 0 ] || [ "$status" -eq 124 ]; then
            echo "expected startup to fail fast at the KMS call, got exit $status"; exit 1
          fi
          echo "$output" | grep -q "EndpointConnectionError"
          if echo "$output" | grep -q "boto3 is required"; then exit 1; fi

      - name: Ingest, restart, and retrieve
        env:
          COMPOSE_RESULT_JSON: evidence/compose.json
        run: |
          mkdir -p evidence
          ./scripts/compose_smoke.sh

      - name: Image HEALTHCHECK reports healthy
        run: |
          container="$(docker compose ps -q api)"
          for _ in $(seq 1 30); do
            health="$(docker inspect --format '{{.State.Health.Status}}' "$container")"
            echo "api health: $health"
            [ "$health" = "healthy" ] && exit 0
            sleep 2
          done
          exit 1

      - name: Metrics expose route templates, never document IDs
        run: |
          curl -fsS http://localhost:8000/metrics > metrics.txt
          grep -q 'encrypted_ir_http_requests_total{.*route="/v1/rag/retrieve"' metrics.txt
          if grep -q 'smoke-' metrics.txt; then echo "document ID leaked into /metrics"; exit 1; fi

      - name: Show container logs
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v

      - name: Keep the smoke result for the evidence job
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidence-docker
          path: evidence/
          if-no-files-found: ignore
          retention-days: 90

  # The production key and auth paths without a cloud account: moto server stands in for AWS KMS
  # and Keycloak is the identity provider, with the API in ENCRYPTED_IR_ENV=prod. Each script runs
  # its own Compose project on a fresh volume, prints the service logs if it fails, and removes
  # the stack on exit.
  e2e:
    name: End-to-end KMS and OIDC
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Create .env from the committed demo values
        run: cp .env.example .env

      - name: Build the API image
        run: docker compose build api

      - name: KMS path (moto) - wrap, start, ingest, restart, retrieve, context binding
        env:
          RESULT_JSON: e2e-results/kms.json
        run: |
          mkdir -p e2e-results
          ./scripts/kms_smoke.sh

      - name: Production mode (Keycloak + moto) - tenants, roles, 401/403/404, restart
        env:
          RESULT_JSON: e2e-results/oidc.json
        run: ./scripts/oidc_smoke.sh

      - name: Upload end-to-end results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidence-e2e
          path: e2e-results/
          if-no-files-found: ignore
          retention-days: 90

  # Performance benchmarks on master only. Informational: not part of CI Success.
  benchmarks:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: encrypted_ir_bench
          POSTGRES_USER: encrypted_ir
          POSTGRES_PASSWORD: encrypted_ir_bench_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U encrypted_ir -d encrypted_ir_bench"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies with research extras
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
          pip install -r requirements-research.txt

      - name: Run benchmarks
        run: |
          mkdir -p benchmarks/results
          PYTHONPATH=src:$PYTHONPATH python -m pytest benchmarks/ \
            --benchmark-only \
            --benchmark-json=benchmarks/results/latest.json

      - name: Keep summary statistics only
        # --benchmark-json embeds every raw timing (about 150 MB); keep min/mean/median/etc.
        run: |
          python - <<'PY'
          import json
          import pathlib

          path = pathlib.Path("benchmarks/results/latest.json")
          report = json.loads(path.read_text())
          for bench in report["benchmarks"]:
              bench["stats"].pop("data", None)
          path.write_text(json.dumps(report, indent=2))
          PY

      - name: Compare with the committed baseline (3x median slowdown fails this job)
        # Informational: this job is not part of CI Success. Shared runners vary by 20-30%,
        # so only a large slowdown is a signal. Refresh the baseline with
        # scripts/compare_benchmarks.py --update when a change is expected.
        run: python scripts/compare_benchmarks.py benchmarks/results/latest.json

      - name: Retrieval benchmark with provenance (SQLite in memory and PostgreSQL)
        # Informational, like the step above. The committed reports in benchmarks/reports/ come
        # from `make bench-retrieval` and `make bench-retrieval-postgres`; these runs record what
        # a shared runner measures for the same code.
        if: always()
        env:
          DATABASE_URL: postgresql+psycopg://encrypted_ir:encrypted_ir_bench_password@localhost:5432/encrypted_ir_bench
        run: |
          PYTHONPATH=src:$PYTHONPATH python -m encrypted_ir.tools.benchmark_retrieval \
            --documents 100 1000 --commit "$GITHUB_SHA" \
            --output-dir benchmarks/results/retrieval/sqlite-memory
          PYTHONPATH=src:$PYTHONPATH python -m encrypted_ir.migrations upgrade head
          PYTHONPATH=src:$PYTHONPATH python -m encrypted_ir.tools.benchmark_retrieval \
            --database-url "$DATABASE_URL" --documents 100 1000 --commit "$GITHUB_SHA" \
            --output-dir benchmarks/results/retrieval/postgresql
          cat benchmarks/results/retrieval/*/retrieval_1000.md

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark-results
          path: benchmarks/results/
          retention-days: 90

  # Package build check.
  build:
    name: Build Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: |
          python -m build

      - name: Check package
        run: |
          twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-package
          path: dist/
          retention-days: 30

  # docs/PORTFOLIO_EVIDENCE.md as this run would render it: the commit, each gating job's result,
  # pytest counts per job, coverage, and the Compose, KMS and OIDC end-to-end results. Runs only
  # when every gating job passed. The release commit's evidence comes from this job on master:
  # copy the `portfolio-evidence` artifact into docs/ in a docs-only commit, then tag that commit
  # (release.yml checks that nothing else changed since the evidence commit).
  evidence:
    name: Evidence (rendered PORTFOLIO_EVIDENCE)
    runs-on: ubuntu-latest
    needs: [lint, test, coverage, security, research, docker, e2e, build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Download the evidence of the gating jobs
        uses: actions/download-artifact@v7
        with:
          pattern: evidence-*
          path: evidence/

      - name: Render docs/PORTFOLIO_EVIDENCE.md
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" > needs.json
          python scripts/render_evidence.py --ci-evidence evidence/ --needs-json needs.json \
            --commit "$GITHUB_SHA" --ref "$GITHUB_REF_NAME" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          cat docs/PORTFOLIO_EVIDENCE.md
          # One line that reproduces the file exactly: base64 of the gzipped Markdown.
          echo "PORTFOLIO_EVIDENCE_GZ_B64=$(gzip -9n < docs/PORTFOLIO_EVIDENCE.md | base64 -w0)"

      - name: Upload the rendered document
        uses: actions/upload-artifact@v7
        with:
          name: portfolio-evidence
          path: docs/PORTFOLIO_EVIDENCE.md
          retention-days: 90

  # Single required status: every gating job must succeed.
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [lint, test, coverage, security, research, docker, e2e, build]
    if: always()
    steps:
      - name: Check all gating jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "  \(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null
