name: Release

# Publishes a GitHub Release when a version tag is pushed, for example:
#   git tag -a v0.9.0 -m "v0.9.0" && git push origin v0.9.0
# The tag must match encrypted_ir.__version__, and CHANGELOG.md must have a
# "## [X.Y.Z]" section for that version; its text becomes the release notes.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Check the tag matches the package version
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/encrypted_ir/__init__.py)"
          echo "package version: ${version}, tag: ${GITHUB_REF_NAME}"
          test "v${version}" = "${GITHUB_REF_NAME}"
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v v="${VERSION}" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md has no '## [${VERSION}]' section" >&2
            exit 1
          fi
          cat release-notes.md

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip
          pip install build twine cyclonedx-bom
          python -m build
          twine check dist/*

      - name: Generate SBOM for the built wheel
        run: |
          python -m venv sbom-env
          sbom-env/bin/pip install dist/*.whl
          cyclonedx-py environment sbom-env/bin/python --output-format JSON \
            --output-file "dist/encrypted-information-retrieval-${VERSION}.cdx.json"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --verify-tag
